name: Build post pages

on:
  push:
    branches: [main]
    paths: [workposts.json, build.js]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add werk sitemap.xml
          git diff --cached --quiet || (git commit -m "Rebuild post pages" && git push)